schema_version: 1
workers:
  low:
    model: "<model-id>"
    reasoning_effort: "<low-or-equivalent>"
  medium:
    model: "<model-id>"
    reasoning_effort: "<medium-or-equivalent>"
  high_risk:
    behavior: "keep_with_main"
    model: null
    reasoning_effort: null
limits:
  max_concurrency: 2
  review_budget: 2
  nested_delegation: false
fallback:
  unavailable_model: "ask"
